name: AuditaPC CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar .NET 10 LTS
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependencias
        run: dotnet restore .\AuditaPC.sln

      - name: Ejecutar pruebas
        run: dotnet test .\AuditaPC.sln -c Release --no-restore --logger "console;verbosity=minimal"

      - name: Compilar solución
        run: dotnet build .\AuditaPC.sln -c Release --no-restore

      - name: Publicar ejecutable portable win-x64
        run: dotnet publish .\src\AuditaPC.App\AuditaPC.App.csproj -c Release -p:PublishProfile=PortableWinX64

      - name: Publicar artefacto de compilación
        uses: actions/upload-artifact@v4
        with:
          name: AuditaPC-win-x64
          path: .\artifacts\publish\win-x64\AuditaPC.exe
          if-no-files-found: error
          retention-days: 14
